name: Code Quality
on: [pull_request]

jobs:
  php-cs:
    name: PHP CS Fixer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Important pour avoir l'historique git complet

      - name: Prepare environment
        uses: ./.github/actions/prepare-for-quality

      - name: Cache PHP-CS-Fixer
        uses: actions/cache@v4
        with:
          path: .php-cs-fixer.cache
          key: ${{ runner.os }}-php-cs-fixer-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-php-cs-fixer-
            ${{ runner.os }}-

      # Pour les PR : analyse seulement les fichiers modifiés
      - name: Get changed PHP files
        id: changed-php-files
        run: ./.github/scripts/get-changed-php-files.sh ${{ github.event.pull_request.base.sha }}

      - name: Run PHP-CS-Fixer on changed files
        if: steps.changed-php-files.outputs.has_changes == 'true'
        run: |
          echo "Running PHP-CS-Fixer with parallel processing..."
          ./bin/tools/php-cs-fixer fix --dry-run --diff --format=checkstyle --config=.php-cs-fixer.dist.php ${{ steps.changed-php-files.outputs.files }} | cs2pr

      - name: Run PHP-CS-Fixer (no changes)
        if: steps.changed-php-files.outputs.has_changes == 'false'
        run: echo "✅ No PHP files to check"

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        uses: ./.github/actions/prepare-for-quality

      - name: Cache PHPStan result cache
        uses: actions/cache@v4
        with:
          path: ./.phpstan-tmp
          key: ${{ runner.os }}-phpstan-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-phpstan-
            ${{ runner.os }}-

      # phpstan-symfony lit le conteneur compilé pour typer les services.
      - name: Warm up the Symfony container
        run: bin/console cache:warmup --env=dev

      # L'analyse porte sur tout le projet : la baseline absorbe la dette existante,
      # seules les nouvelles erreurs font échouer le job.
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse -c phpstan.dist.neon --no-progress --memory-limit=-1

  rector:
    name: Rector
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        uses: ./.github/actions/prepare-for-quality

      - name: Run Rector (dry-run)
        run: vendor/bin/rector process --dry-run --no-progress-bar

  security:
    name: Dépendances vulnérables
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      # N'installe rien : lit composer.lock et interroge la base d'advisories.
      # `--abandoned=report` signale les paquets abandonnés sans faire échouer le job :
      # les trois concernés (doctrine/cache, package-versions-deprecated,
      # php-http/message-factory) sont des dépendances transitives.
      - name: composer audit
        run: composer audit --locked --abandoned=report --no-interaction
