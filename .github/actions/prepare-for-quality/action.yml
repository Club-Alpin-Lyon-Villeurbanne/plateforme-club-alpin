name: 'Prepare Environment for Quality'
description: 'Prepares the environment for quality checks'
runs:
  using: 'composite'
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite
        coverage: none
        tools: cs2pr

    - name: Get Composer Cache Directory
      shell: bash
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer dependencies
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Cache Vendor
      id: cache-vendor
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-vendor-${{ hashFiles('composer.lock') }}

    # Installe aussi les outils qualité : PHPStan, Rector et PHP-CS-Fixer sont
    # tous les trois des dépendances de dev, versionnées dans composer.lock.
    - name: Install dependencies
      shell: bash
      if: ${{ steps.cache-vendor.outputs.cache-hit != 'true' }}
      run: composer install --prefer-dist --no-progress --no-interaction --ignore-platform-req=ext-uopz
